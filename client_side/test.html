<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Boxes</title>
  <style>
    :root {
      --primary-color: #D72323;
      --accent-color: #3E3636;
      --background-color: #F5EDED;
      --black: #0C0C0C;
      --subtext-color: #555;
    }

    body {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #fff;
    }

    .box {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .primary { background: var(--primary-color); }
    .accent { background: var(--accent-color); }
    .bg { background: var(--background-color); border: 1px solid #ccc; }
    .black { background: var(--black); }
    .subtext { background: var(--subtext-color); }
  </style>
</head>
<body>
  <div class="box primary"></div>
  <div class="box accent"></div>
  <div class="box bg"></div>
  <div class="box black"></div>
  <div class="box subtext"></div>
</body>
</html>
