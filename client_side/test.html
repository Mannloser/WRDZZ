<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WRDZZ</title>
  <script>
    let frames = [
      "W",
      "WR",
      "WRD",
      "WRDZ",
      "WRDZZ",
      "WRDZ",
      "WRD",
      "WR",
      "W"
    ];

    let i = 0;
    setInterval(() => {
      document.title = frames[i];
      i = (i + 1) % frames.length;
    }, 250); // speed (ms) → change for faster/slower
  </script>
</head>
<body>
  <h1>Look at the tab 👆</h1>
</body>
</html>
